version: 2
updates:
  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"

  # Docker Compose
  - package-ecosystem: "docker-compose"
    directory: "/docker-compose"
    schedule:
      interval: "weekly"

  # Docker (Dockerfile for the Blazor App)
  - package-ecosystem: "docker"
    directory: "/Papra.Companion"
    schedule:
      interval: "weekly"

  # NuGet (versions in Directory.Packages.props)
  - package-ecosystem: "nuget"
    directory: "/"
    schedule:
      interval: "weekly"
